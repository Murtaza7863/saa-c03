<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAA-C03 — Solutions Architect Associate</title>
  <link rel="stylesheet" href="css/app.css?v=3">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23ff9900'/><text x='16' y='22' text-anchor='middle' font-size='16' font-family='system-ui' font-weight='700' fill='%23111'>SA</text></svg>">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark">SA</span>
        <span>
          <strong>SAA-C03</strong>
          <em id="brand-sub">Learn the job, then the exam</em>
        </span>
      </a>
      <nav class="side-nav" id="side-nav"></nav>
      <div class="sidebar-foot">
        <button type="button" class="theme-btn" id="theme-btn" title="Toggle theme">Theme</button>
        <p class="tiny">Progress stays in this browser.</p>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button type="button" class="menu-btn" id="menu-btn" aria-label="Open menu">☰</button>
        <label class="search">
          <span>Search</span>
          <input id="search" type="search" placeholder="IAM, Aurora, NAT, RPO…" autocomplete="off">
        </label>
        <div class="mode-switch" role="tablist" aria-label="Study mode">
          <button type="button" id="mode-learn" data-mode="learn">Learn</button>
          <button type="button" id="mode-exam" data-mode="exam">Exam</button>
        </div>
        <div class="top-progress" id="top-progress"></div>
      </header>
      <main id="view"></main>
    </div>
  </div>
  <div class="scrim" id="scrim"></div>

  <script src="js/store.js?v=3"></script>
  <script src="content/core.js?v=3"></script>
  <script src="content/foundations.js?v=3"></script>
  <script src="content/d1.js?v=3"></script>
  <script src="content/d2.js?v=3"></script>
  <script src="content/d3.js?v=3"></script>
  <script src="content/d4.js?v=3"></script>
  <script src="content/gaps.js?v=3"></script>
  <script src="content/extras.js?v=3"></script>
  <script src="content/tools.js?v=3"></script>
  <script src="content/practitioner.js?v=3"></script>
  <script src="content/use.js?v=3"></script>
  <script src="content/exam1.js?v=3"></script>
  <script src="content/exam2.js?v=3"></script>
  <script src="content/bank.js?v=3"></script>
  <script src="content/guide.js?v=3"></script>
  <script src="content/coverage.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
